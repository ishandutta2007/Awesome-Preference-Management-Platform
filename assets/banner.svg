<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1e1035"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes floatShield{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes waveBeam{0%{stroke-dashoffset:1000}}.floating-shield,.pulsing-orb{transform-origin:center}.pulsing-orb{animation:pulseGlow 4s ease-in-out infinite}.floating-shield{animation:floatShield 5s ease-in-out infinite}.accent-text{fill:url(#accent-grad)}</style><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><circle cx="150" cy="80" r="180" fill="#7c3aed" class="pulsing-orb" opacity=".15"/><circle cx="1050" cy="280" r="220" fill="#0284c7" class="pulsing-orb" opacity=".12" style="animation-delay:2s"/><g stroke="#fff" stroke-width="1" opacity=".05"><path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300"/><path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360"/></g><g class="floating-shield" filter="url(#soft-shadow)" transform="translate(100, 180)"><path fill="#1e1b4b" stroke="url(#accent-grad)" stroke-wi